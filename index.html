<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1520">
<title>満開の桜 WebAR</title>
<style>
:root { --ink:#0e1520; --snow:#f3f6fb; --sakura:#ff9bb9; --sakura-deep:#d9456f; --glass:rgba(14,21,32,.55); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--ink); color:var(--snow);
  font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; overscroll-behavior:none; }
#v { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:var(--ink); }
#c { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
.ui { position:fixed; left:0; right:0; padding-left:max(14px,env(safe-area-inset-left)); padding-right:max(14px,env(safe-area-inset-right)); pointer-events:none; }
#top { top:0; padding-top:max(12px,env(safe-area-inset-top)); display:flex; justify-content:center; }
#chip { background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:999px; padding:8px 16px; font-size:13px; line-height:1.4; text-align:center; transition:opacity .6s; max-width:92%; }
#bar { bottom:0; padding-bottom:max(18px,env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; gap:14px; }
#bar button { pointer-events:auto; font:inherit; font-size:14px; font-weight:600; color:var(--snow); background:var(--glass); border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:999px; min-height:48px; padding:0 18px; }
#bar button:focus-visible, #go:focus-visible, #shot button:focus-visible { outline:3px solid var(--sakura); outline-offset:2px; }
#bar button[aria-pressed="false"] { opacity:.55; }
#snap { width:72px; height:72px; padding:0 !important; border:4px solid #fff !important; background:var(--sakura-deep) !important; border-radius:50% !important; font-size:0 !important; }
#intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px;
  background:radial-gradient(120% 90% at 50% 0%, #26344a 0%, var(--ink) 70%); }
#intro h1 { margin:0; font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-size:clamp(30px,8vw,44px); letter-spacing:.06em; }
#intro p { margin:0; max-width:24em; color:#b8c3d6; line-height:1.8; font-size:15px; }
#go { font:inherit; font-size:17px; font-weight:700; color:#2a0a16; background:var(--sakura); border:0; border-radius:999px; min-height:56px; padding:0 36px; }
#intro small { color:#8794a8; font-size:12px; max-width:26em; line-height:1.7; }
#shot { position:fixed; inset:0; background:rgba(8,12,20,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
#shot img { max-width:100%; max-height:70%; border-radius:8px; -webkit-touch-callout:default; }
#shot .r { display:flex; gap:10px; }
#shot button, #shot a { font:inherit; font-weight:600; color:var(--snow); background:#2a384e; border:0; border-radius:999px; min-height:46px; padding:0 22px; display:inline-flex; align-items:center; text-decoration:none; }
#shot p { margin:0; font-size:13px; color:#b8c3d6; text-align:center; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>

<div class="ui" id="top"><div id="chip" role="status"></div></div>
<div class="ui" id="bar" hidden>
  <button id="add" type="button">＋ 桜</button>
  <button id="snap" type="button" aria-label="撮影">撮影</button>
  <button id="petal" type="button" aria-pressed="true">花びら</button>
  <button id="del" type="button">消す</button>
</div>

<section id="intro">
  <h1>満開の桜</h1>
  <p>カメラを向けた先に、満開の桜を咲かせます。雪の降る窓の外にも、庭にも。</p>
  <button id="go" type="button">桜を咲かせる</button>
  <small>カメラと動きセンサーを使います。映像や写真は端末の外へ送られません。画面をタップした場所へ桜を移動し、2本指で大きさを変えられます。※位置はセンサーによる概略表示です。</small>
</section>

<div id="shot" hidden>
  <img id="shotimg" alt="撮影した写真">
  <p>画像を長押し（パソコンでは右クリック）して保存できます</p>
  <div class="r"><a id="dl" download="sakura-ar.png">保存</a><button id="share" type="button" hidden>共有</button><button id="close" type="button">閉じる</button></div>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const video = $('v'), cv = $('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CAM_H = 1.4;          // 手に持った高さ(m)
const SPRITE_M = 10;        // スプライト1000pxが表す実寸(m)。桜の高さは約7m
let W = 0, H = 0, DPR = 1, F = 600, streaming = false, T = 0;

/* ---------- クォータニオン ---------- */
const qmul = (a, b) => [
  a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
  a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
  a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
  a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
const qconj = (q) => [-q[0], -q[1], -q[2], q[3]];
function qrot(q, v) {
  const [x, y, z, w] = q;
  const tx = 2*(y*v[2] - z*v[1]), ty = 2*(z*v[0] - x*v[2]), tz = 2*(x*v[1] - y*v[0]);
  return [v[0] + w*tx + (y*tz - z*ty), v[1] + w*ty + (z*tx - x*tz), v[2] + w*tz + (x*ty - y*tx)];
}
function qEuler(beta, alpha, gamma, orient) {   // three.js DeviceOrientationControls と同じ計算
  const x = beta, y = alpha, z = -gamma;
  const c1 = Math.cos(x/2), c2 = Math.cos(y/2), c3 = Math.cos(z/2), s1 = Math.sin(x/2), s2 = Math.sin(y/2), s3 = Math.sin(z/2);
  let q = [s1*c2*c3 + c1*s2*s3, c1*s2*c3 - s1*c2*s3, c1*c2*s3 - s1*s2*c3, c1*c2*c3 + s1*s2*s3];
  q = qmul(q, [-Math.SQRT1_2, 0, 0, Math.SQRT1_2]);
  return qmul(q, [0, 0, Math.sin(-orient/2), Math.cos(-orient/2)]);
}
const nlerp = (a, b, t) => {
  const s = (a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3]) < 0 ? -1 : 1;
  const q = a.map((v, i) => v + (s*b[i] - v) * t), n = Math.hypot(...q) || 1;
  return q.map((v) => v / n);
};

/* ---------- 向きの取得 ---------- */
let qCur = [0, 0, 0, 1], qTar = [0, 0, 0, 1], hasSensor = false, absSeen = false, lastSensorAt = 0;
let manYaw = 0, manPitch = 0;
const screenAngle = () => ((screen.orientation && screen.orientation.angle != null ? screen.orientation.angle : (window.orientation || 0)) * Math.PI) / 180;
function onOrient(e, isAbs) {
  if (e.beta == null || e.alpha == null) return;
  if (isAbs) absSeen = true; else if (absSeen) return;
  const r = Math.PI / 180;
  qTar = qEuler(e.beta*r, e.alpha*r, e.gamma*r, screenAngle());
  lastSensorAt = performance.now();
  if (!hasSensor) { qCur = qTar; hasSensor = true; }
}
addEventListener('deviceorientationabsolute', (e) => onOrient(e, true));
addEventListener('deviceorientation', (e) => onOrient(e, false));
addEventListener('orientationchange', () => { /* 画面回転後のセンサー値を次のイベントから反映 */ });
function manualQ() { return qmul([0, Math.sin(manYaw/2), 0, Math.cos(manYaw/2)], [Math.sin(manPitch/2), 0, 0, Math.cos(manPitch/2)]); }

/* ---------- 桜スプライト ---------- */
const PAL = ['#fff7f9', '#ffe3ea', '#ffcddb', '#ffb5ca', '#f79bb8'];
const rnd = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function makeTree(seed) {
  const S = 1000, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), r = rnd(seed), BX = 500, BY = 930;
  g.fillStyle = 'rgba(40,30,60,0.16)'; g.beginPath(); g.ellipse(BX, BY + 6, 300, 30, 0, 0, 7); g.fill();
  for (let i = 0; i < 420; i++) {
    const a = r() * 6.283, d = Math.sqrt(r()), x = BX + Math.cos(a) * d * 380, y = BY + 8 + Math.sin(a) * d * 48;
    g.fillStyle = PAL[1 + (r() * 3 | 0)]; g.globalAlpha = 0.85;
    g.beginPath(); g.ellipse(x, y, 5 + r() * 3, 2.4 + r() * 1.2, r() * 3, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  const br = [], an = [];
  (function rec(x, y, ang, len, w, d) {
    const x2 = x + Math.sin(ang) * len, y2 = y - Math.cos(ang) * len;
    br.push([x, y, x2, y2, w]);
    if (d >= 4) { const n = Math.max(2, len / 12 | 0); for (let i = 0; i < n; i++) { const t = r(); an.push([x + (x2 - x) * t, y + (y2 - y) * t, d]); } }
    if (d >= 9 || len < 14) { an.push([x2, y2, d + 1], [x2, y2, d + 1]); return; }
    const k = d < 1 ? 3 : (r() < 0.25 ? 3 : 2);
    for (let i = 0; i < k; i++) {
      const side = k === 3 ? i - 1 : (i ? 1 : -1);
      rec(x2, y2, ang * 0.72 + side * (d < 2 ? 0.62 : 0.5) * (0.7 + r() * 0.6) + (r() - 0.5) * 0.25, len * (d < 1 ? 0.95 : 0.76 + r() * 0.06), w * 0.68, d + 1);
    }
  })(BX, BY, 0, 150, 26, 0);
  g.lineCap = 'round';
  for (const [x, y, x2, y2, w] of br) { g.strokeStyle = w > 9 ? '#3e302c' : '#4d3b36'; g.lineWidth = Math.max(1.2, w); g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke(); }
  for (const [x, y] of an) { g.fillStyle = 'rgba(255,170,195,0.11)'; g.beginPath(); g.arc(x + (r() - 0.5) * 20, y + (r() - 0.5) * 20, 20 + r() * 12, 0, 7); g.fill(); }
  const fl = [];
  for (const [x, y] of an) { const n = 3 + (r() * 3 | 0); for (let i = 0; i < n; i++) fl.push([x + (r() - 0.5) * 38, y + (r() - 0.5) * 38]); }
  for (let i = fl.length - 1; i > 0; i--) { const j = r() * (i + 1) | 0; [fl[i], fl[j]] = [fl[j], fl[i]]; }
  for (const [x, y] of fl) {
    const s = 5 + r() * 4, t = Math.min(1, Math.max(0, (y - 250) / 650));
    g.fillStyle = PAL[Math.min(4, Math.max(0, (r() * 3 + t * 2.2) | 0))]; g.globalAlpha = 0.93;
    const rot = r() * 6.283;
    for (let k = 0; k < 5; k++) { const a = rot + k * 1.2566; g.beginPath(); g.ellipse(x + Math.cos(a) * s * 0.6, y + Math.sin(a) * s * 0.6, s * 0.62, s * 0.42, a, 0, 7); g.fill(); }
    g.globalAlpha = 0.85; g.fillStyle = '#e0587f'; g.beginPath(); g.arc(x, y, s * 0.17, 0, 7); g.fill();
  }
  // 花房の立体感を出す、大小の淡い花房レイヤー
  for (let i = 0; i < 115; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r());
    const x = BX + Math.cos(a) * d * 350, y = 570 + Math.sin(a) * d * 285;
    const rad = 12 + r() * 22;
    const grad = g.createRadialGradient(x - rad*.25, y - rad*.3, 1, x, y, rad);
    grad.addColorStop(0, 'rgba(255,250,253,.30)');
    grad.addColorStop(.58, 'rgba(255,190,211,.17)');
    grad.addColorStop(1, 'rgba(238,125,165,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, rad, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  return c;
}
const sprites = [makeTree(7), makeTree(23)];

/* ---------- 桜の配置 ---------- */
let trees = [], sel = -1, showUI = true;
function camQ() { return hasSensor ? qCur : manualQ(); }
function dirFromScreen(sx, sy, q) { const v = qrot(q, [(sx - W/2) / F, -(sy - H/2) / F, -1]); const n = Math.hypot(...v); return v.map((a) => a / n); }
function groundPoint(dir) {
  let x, z;
  if (dir[1] < -0.03) { const t = CAM_H / -dir[1]; x = dir[0] * t; z = dir[2] * t; } else { x = dir[0]; z = dir[2]; }
  let h = Math.hypot(x, z) || 1; const d = Math.min(40, Math.max(3, dir[1] < -0.03 ? h : 25));
  return [x / h * d, -CAM_H, z / h * d];
}
function addTree(p, s) {
  if (trees.length >= 6) { say('桜は6本までです'); return; }
  trees.push({ p, s: s || 1, v: trees.length % 2, flip: Math.random() < 0.5, ph: Math.random() * 6, born: T });
  sel = trees.length - 1;
  for (let i = 0; i < 40; i++) spawnPetal({}, 'burst', p);
}
function addAhead() {
  const f = qrot(camQ(), [0, 0, -1]); let x = f[0], z = f[2]; const h = Math.hypot(x, z);
  if (h < 0.2) { x = 0; z = -1; } else { x /= h; z /= h; }
  const d = trees.length ? 11 + Math.random() * 8 : 14;
  const side = trees.length ? (Math.random() - 0.5) * 0.6 : 0, c = Math.cos(side), s = Math.sin(side);
  addTree([(x*c - z*s) * d, -CAM_H, (x*s + z*c) * d], trees.length ? 0.7 + Math.random() * 0.3 : 1);
}

/* ---------- 投影 ---------- */
function proj(q, v) { const c = qrot(qconj(q), v); return c[2] > -0.1 ? null : { x: W/2 + F * c[0] / -c[2], y: H/2 - F * c[1] / -c[2], d: -c[2] }; }
function projTree(t, q) {
  const b = proj(q, t.p); if (!b) return null;
  const u = proj(q, [t.p[0], t.p[1] + 1, t.p[2]]);
  const ang = u ? Math.atan2(u.x - b.x, -(u.y - b.y)) : 0;
  const e = Math.min(1, (T - t.born) / 1.6), ease = 1 + 2.7 * Math.pow(e - 1, 3) + 1.7 * Math.pow(e - 1, 2);
  const k = F * SPRITE_M * t.s / b.d / 1000 * (reduce ? 1 : Math.max(0.05, ease));
  return { b, ang, k, e };
}

/* ---------- 花びら ---------- */
let petals = [], petalsOn = true;
function spawnPetal(p, mode, at) {
  p.sz = (3 + Math.random() * 4) * Math.max(H, 500) / 800;
  p.rot = Math.random() * 6.28; p.vr = (Math.random() - 0.5) * 2.4; p.fl = Math.random() * 6.28; p.c = PAL[1 + (Math.random() * 3 | 0)];
  p.vy = (30 + Math.random() * 40) * H / 800; p.vx = (Math.random() - 0.3) * 18;
  if (mode === 'burst') {
    const q = camQ(), s = at && proj(q, [at[0], at[1] + 5, at[2]]);
    p.x = s ? s.x + (Math.random() - 0.5) * 160 : Math.random() * W; p.y = s ? s.y + (Math.random() - 0.5) * 140 : -10; p.life = 3 + Math.random() * 3; petals.push(p);
  } else { p.x = Math.random() * W; p.y = mode === 'init' ? Math.random() * H : -10 - Math.random() * 40; }
  return p;
}
function seedPetals() { const burst = petals.filter((p) => p.life), base = petals.filter((p) => !p.life), n = petalsOn && !reduce ? 70 : 0; while (base.length < n) base.push(spawnPetal({}, 'init')); base.length = n; petals = burst.concat(base); }

/* ---------- 描画 ---------- */
function drawCover(g, el, w, h) {
  const vw = el.videoWidth, vh = el.videoHeight; if (!vw) return false;
  const s = Math.max(w / vw, h / vh), dw = vw * s, dh = vh * s; g.drawImage(el, (w - dw) / 2, (h - dh) / 2, dw, dh); return true;
}
function drawFallbackBg(g, q) {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#a9b9d3'); sky.addColorStop(1, '#f4e6e8');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const n = qrot(qconj(q), [0, 1, 0]);
  if (Math.abs(n[1]) > 0.02) {
    const yy = (x) => H/2 - F * ((n[2] - n[0] * ((x - W/2) / F)) / n[1]);
    g.fillStyle = '#e6edf6'; g.beginPath(); g.moveTo(-W, yy(-W)); g.lineTo(2*W, yy(2*W));
    const far = n[1] > 0 ? 3*H : -3*H; g.lineTo(2*W, far); g.lineTo(-W, far); g.fill();
  }
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  const q = camQ();
  if (!streaming) drawFallbackBg(ctx, q);
  const list = trees.map((t, i) => ({ t, i, p: projTree(t, q) })).filter((o) => o.p).sort((a, b) => b.p.b.d - a.p.b.d);
  for (const { t, i, p } of list) {
    ctx.save(); ctx.translate(p.b.x, p.b.y); ctx.rotate(p.ang + (reduce ? 0 : Math.sin(T * 0.7 + t.ph) * 0.006));
    if (showUI && i === sel) {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.setLineDash([8, 7]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, F * 2.2 * t.s / p.b.d, F * 0.55 * t.s / p.b.d, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.globalAlpha = Math.min(1, 0.2 + p.e * 1.2); ctx.scale(t.flip ? -p.k : p.k, p.k);
    ctx.drawImage(sprites[t.v], -500, -930); ctx.restore();
  }
  for (const p of petals) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(p.fl)));
    ctx.fillStyle = p.c; ctx.globalAlpha = 0.92; ctx.beginPath(); ctx.ellipse(0, 0, p.sz * 1.3, p.sz * 0.8, 0, 0, 7); ctx.fill(); ctx.restore();
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (hasSensor) { const age = now - lastSensorAt; const follow = age > 1200 ? 0.08 : 1 - Math.exp(-dt * 13); qCur = nlerp(qCur, qTar, follow); }
  const wind = reduce ? 0 : Math.sin(T * 0.3) * 18 + 16;
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i]; p.y += p.vy * dt; p.x += (p.vx + wind + Math.sin(T * 1.3 + p.fl) * 12) * dt; p.rot += p.vr * dt; p.fl += dt * 3;
    if (p.life) { p.life -= dt; if (p.life <= 0 || p.y > H + 10) petals.splice(i, 1); }
    else if (p.y > H + 10 || p.x > W + 20) { p.y = -10; p.x = Math.random() * W - 40; }
  }
  render(); requestAnimationFrame(frame);
}

/* ---------- 画面サイズ ---------- */
function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = H * DPR; F = Math.max(W, H) / (2 * Math.tan(31 * Math.PI / 180));
}
addEventListener('resize', resize); resize();

/* ---------- メッセージ ---------- */
let chipTimer = 0;
function say(t, keep) { const c = $('chip'); c.textContent = t; c.style.opacity = t ? 1 : 0; clearTimeout(chipTimer); if (t && !keep) chipTimer = setTimeout(() => { c.style.opacity = 0; }, 6000); }

/* ---------- タップ・ピンチ ---------- */
const ptrs = new Map(); let pinch = 0, downAt = null, moved = false;
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 1) { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; moved = false; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); moved = true; }
});
cv.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch && sel >= 0) trees[sel].s = Math.min(2.5, Math.max(0.25, trees[sel].s * d / pinch));
    pinch = d; return;
  }
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 10) moved = true;
  if (!hasSensor && moved) { manYaw += (prev.clientX - e.clientX) * 0.005; manPitch = Math.max(-1.4, Math.min(1.4, manPitch + (prev.clientY - e.clientY) * 0.005)); }
});
function endPtr(e) {
  const wasOne = ptrs.size === 1; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0;
  if (wasOne && !moved && downAt && performance.now() - downAt.t < 500) tap(e.clientX, e.clientY);
  if (!ptrs.size) downAt = null;
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); pinch = 0; });
cv.addEventListener('wheel', (e) => { if (sel >= 0) { e.preventDefault(); trees[sel].s = Math.min(2.5, Math.max(0.25, trees[sel].s * (e.deltaY < 0 ? 1.06 : 0.94))); } }, { passive: false });
function tap(x, y) {
  const q = camQ();
  for (let i = trees.length - 1; i >= 0; i--) {
    const t = trees[i], m = proj(q, [t.p[0], t.p[1] + 3.5 * t.s, t.p[2]]);
    if (m && Math.hypot(m.x - x, m.y - y) < F * 3.2 * t.s / m.d) { if (i !== sel) { sel = i; return; } break; }
  }
  const p = groundPoint(dirFromScreen(x, y, q));
  if (sel < 0) addTree(p, 1); else { trees[sel].p = p; trees[sel].born = T - 1.0; }
}

/* ---------- ボタン ---------- */
$('add').addEventListener('click', addAhead);
$('del').addEventListener('click', () => { if (sel < 0) return; trees.splice(sel, 1); sel = trees.length - 1; });
$('petal').addEventListener('click', (e) => { petalsOn = !petalsOn; e.currentTarget.setAttribute('aria-pressed', petalsOn); seedPetals(); });

/* ---------- 撮影 ---------- */
$('snap').addEventListener('click', () => {
  showUI = false; render();
  const o = document.createElement('canvas'); o.width = cv.width; o.height = cv.height;
  const g = o.getContext('2d');
  if (!(streaming && drawCover(g, video, o.width, o.height))) { g.fillStyle = '#c9d4e4'; g.fillRect(0, 0, o.width, o.height); }
  g.drawImage(cv, 0, 0); showUI = true;
  o.toBlob((b) => {
    if (!b) { say('撮影に失敗しました'); return; }
    const url = URL.createObjectURL(b); $('shotimg').src = url; $('dl').href = url; $('shot').hidden = false;
    const file = new File([b], 'sakura-ar.png', { type: 'image/png' });
    const can = navigator.canShare && navigator.canShare({ files: [file] });
    $('share').hidden = !can; $('share').onclick = () => navigator.share({ files: [file], title: '満開の桜' }).catch(() => {});
  }, 'image/png');
});
$('close').addEventListener('click', () => { $('shot').hidden = true; });

/* ---------- 開始 ---------- */
$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  const needPerm = window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function';
  const op = needPerm ? DeviceOrientationEvent.requestPermission().catch(() => 'denied') : Promise.resolve('granted');
  const cp = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    ? navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).catch((e) => e)
    : Promise.resolve(new Error('nocam'));
  const [perm, stream] = await Promise.all([op, cp]);
  $('intro').hidden = true; $('bar').hidden = false;
  let notes = [];
  if (stream && stream.getTracks) {
    video.srcObject = stream; video.muted = true; video.playsInline = true;
    try { await video.play(); } catch (e) {}
    if (!video.videoWidth) await new Promise((resolve) => { const done = () => resolve(); video.addEventListener('loadedmetadata', done, { once: true }); setTimeout(done, 1800); });
    streaming = !!video.videoWidth;
    if (!streaming) { stream.getTracks().forEach((track) => track.stop()); video.srcObject = null; notes.push('カメラ映像を開始できませんでした。Safariでカメラの使用を許可して再読み込みしてください'); }
  }
  else { video.hidden = true; notes.push(location.protocol === 'https:' || location.hostname === 'localhost' ? 'カメラを使えないため、雪景色の背景で表示します' : 'カメラにはHTTPSでの公開が必要です。背景だけで表示します'); }
  if (perm !== 'granted') { notes.push('動きセンサーが許可されていません。画面をドラッグして見回せます'); }
  seedPetals();
  setTimeout(() => {
    if (!hasSensor && perm === 'granted') notes.push('動きセンサーが見つかりません。画面をドラッグして見回せます');
    addAhead();
    say(notes.length ? notes.join('。') : '端末をゆっくり動かして、桜のまわりを見てみてください。地面をタップすると桜が移動します', !!notes.length);
  }, 700);
});
requestAnimationFrame(frame);
})();
</script>
